name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Validate package
        run: npm run ci
      - name: Verify npm publishing lifecycle
        run: npm run release:check
      - name: Install browser
        run: npm exec playwright install --with-deps chromium
      - name: Verify browser interactions and hydration
        run: npm run test:browser
      - name: Upload validated package build
        id: prepared-package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-package
          path: dist
          if-no-files-found: error
          retention-days: 1
    outputs:
      prepared-package-id: ${{ steps.prepared-package.outputs.artifact-id }}

  publish:
    name: Publish npm package
    needs: validate
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify revision is current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Restore validated package build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.prepared-package-id || 'missing' }}
          path: dist
      - name: Verify restored package
        run: npm run pack:check
      - name: Publish release
        run: npm exec --no -- semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
      - name: Verify npm publication
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          if [ -z "$tag" ]; then
            echo "No release was created for this commit."
            exit 0
          fi
          version=${tag#v}
          for attempt in 1 2 3 4 5; do
            published=$(npm view "@eufemia/illustrations@$version" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              echo "Verified @eufemia/illustrations@$version on npmjs.org" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "The release is not available on npmjs.org yet." >&2
          exit 1
